# Pinned versions for reproducible runs (bioconda). Delly, the default SV caller, runs natively on
# Apple Silicon and has its own environment (envs/delly.yml). Manta (optional, --sv_caller manta) needs Python 2.7 and has its own environment
# (envs/manta.yml); its bioconda osx-64 package ships Linux binaries, so on a Mac use the container
# quay.io/biocontainers/manta:1.6.0--h9ee0642_2 (Docker) instead.
name: genome-brca12
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - bwa=0.7.18
  - samtools=1.21
  - bcftools=1.21
  - htslib=1.21
  - gatk4=4.6.1.0
  - cnvkit=0.9.11
  - mosdepth=0.3.10
  - ensembl-vep=113.0
  - perl-list-moreutils    # missing VEP dependency in some ensembl-vep 113 builds
