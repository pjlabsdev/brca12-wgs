[package]
name = "brca12-wgs"
version = "2.0.0-dev"
edition = "2024"
description = "BRCA1/BRCA2 germline analysis from whole-genome sequencing in one program (GRCh38), research use only"
license = "MIT"
repository = "https://github.com/pjlabsdev/brca12-wgs"

[dependencies]
flate2 = "1.1.11"
noodles = { version = "0.119", features = ["bam", "cram", "sam", "bgzf", "core", "fasta", "csi"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
opt-level = 3
