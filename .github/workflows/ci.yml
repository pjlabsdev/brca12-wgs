name: CI
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m unittest discover -s tests -v
  pipeline-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: nf-core/setup-nextflow@v2
        with: { version: "24.10.4" }
      - run: bash tests/run_stub_pipeline.sh
      - run: bash tests/run_stub_batch.sh
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container and check every tool
        run: docker build -t brca12-wgs:ci .
      - name: Tool versions inside the container
        run: |
          docker run --rm brca12-wgs:ci bash -c 'samtools --version | head -1; gatk --version | tail -1; cnvkit.py version; mosdepth --version; /opt/conda/envs/manta/bin/configManta.py --version'
