name: CI
on:
  push:
  pull_request:
jobs:
  # brca12-wgs 2.0 (Rust, one program without external tools), as the hla-wgs CI
  rust-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - name: Version and usage text
        run: |
          ./target/release/brca12-wgs --version
          ./target/release/brca12-wgs 2>&1 | grep -q "R1.fastq.gz R2.fastq.gz OUTPREFIX"
      - name: Start file syntax
        run: bash -n start/brca12-wgs-start.command
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m unittest discover -s tests -v
  pipeline-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: nf-core/setup-nextflow@v2
        with: { version: "24.10.4" }
      - run: bash tests/run_stub_pipeline.sh
      - run: bash tests/run_stub_batch.sh
      - run: bash tests/run_start_package.sh
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container and check every tool
        run: docker build -t brca12-wgs:ci .
      - name: Tool versions inside the container
        run: |
          docker run --rm brca12-wgs:ci bash -c 'samtools --version | head -1; gatk --version | tail -1; cnvkit.py version; mosdepth --version; /opt/conda/envs/manta/bin/configManta.py --version'
